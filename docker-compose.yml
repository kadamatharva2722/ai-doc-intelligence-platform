services:
  postgres:
    image: postgres:16-alpine
    container_name: docintel-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: docintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - docintel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: docintel-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - docintel-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: docintel-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - docintel-network

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: docintel-auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      AUTH_DB_NAME: docintel_auth
      DB_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_secure_random_at_least_32_character_string}
    networks:
      - docintel-network

  document-service:
    build:
      context: ./backend
      dockerfile: document-service/Dockerfile
    container_name: docintel-document-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DOCS_DB_NAME: docintel_docs
      DB_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_secure_random_at_least_32_character_string}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - docintel-network

  ai-service:
    build:
      context: ./backend
      dockerfile: ai-service/Dockerfile
    container_name: docintel-ai-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      document-service:
        condition: service_started
    environment:
      DB_HOST: postgres
      AI_DB_NAME: docintel_ai
      DB_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DOCUMENT_SERVICE_URL: http://document-service:8082
      UPLOAD_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_with_your_actual_api_key}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_secure_random_at_least_32_character_string}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - docintel-network

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: docintel-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - document-service
      - ai-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      DOCUMENT_SERVICE_URL: http://document-service:8082
      AI_SERVICE_URL: http://ai-service:8083
    networks:
      - docintel-network

  frontend:
    build: ./frontend
    container_name: docintel-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - docintel-network

volumes:
  postgres_data:
  backend_uploads:

networks:
  docintel-network:
    driver: bridge
