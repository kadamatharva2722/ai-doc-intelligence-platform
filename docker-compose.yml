version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: docintel-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: docintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:postgrespassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docintel-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: docintel-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - docintel-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: docintel-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - docintel-network

  backend:
    build: ./backend
    container_name: docintel-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/docintel
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:postgrespassword}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY:replace_with_your_actual_api_key}
      SPRING_AI_OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - docintel-network

  frontend:
    build: ./frontend
    container_name: docintel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - docintel-network

volumes:
  postgres_data:
  backend_uploads:

networks:
  docintel-network:
    driver: bridge
